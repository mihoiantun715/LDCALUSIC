<!DOCTYPE html>
<html lang="hr">
<head>
<link rel="stylesheet" href="/loading.css?v=1"><script src="/loading.js?v=1"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - LD ČALUŠIĆ</title>
    <link rel="stylesheet" href="styles.css?v=clean-ui-1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--secondary-blue) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .admin-login-container {
            background: var(--white);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
        }

        .admin-login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .admin-login-header i {
            font-size: 4rem;
            color: var(--primary-blue);
            margin-bottom: 20px;
        }

        .admin-login-header h1 {
            color: var(--dark-blue);
            margin-bottom: 10px;
        }

        .admin-login-header p {
            color: var(--text-light);
        }

        .admin-form-group {
            margin-bottom: 25px;
        }

        .admin-form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark-blue);
        }

        .admin-form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .admin-form-group input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(30,91,168,0.1);
        }

        .admin-login-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary-blue);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .admin-login-btn:hover {
            background: var(--dark-blue);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(30,91,168,0.4);
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .back-link a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .reset-link{display:block;margin:18px auto 0;border:0;background:transparent;color:#175ec8;font:inherit;cursor:pointer;text-decoration:underline}
        .reset-dialog{width:min(440px,calc(100% - 32px));border:1px solid #d5e2f2;border-radius:20px;padding:30px;color:#173757;margin:auto;box-shadow:0 24px 70px #102e5040}
        .reset-dialog::backdrop{background:#102e5080;backdrop-filter:blur(3px)}
        .reset-dialog h2{margin:0 0 12px}.reset-dialog p{margin:0 0 22px;line-height:1.6}
        .reset-close{float:right;border:0;background:#edf4ff;color:#173757;border-radius:50%;width:32px;height:32px;font-size:23px;cursor:pointer}
        .reset-status{margin-top:16px!important;padding:12px;border-radius:10px;background:#edf4ff;overflow-wrap:anywhere}
        button:disabled{opacity:.6;cursor:wait}.reset-dialog button:focus-visible,.reset-link:focus-visible{outline:3px solid #65a4ff;outline-offset:3px}
        @media(max-width:480px){.admin-login-container{padding:28px}.reset-dialog{padding:24px}}
    </style>
</head>
<body>
    <div class="admin-login-container">
        <div class="admin-login-header">
            <i class="fas fa-user-shield"></i>
            <h1>Admin Prijava</h1>
            <p>LD ČALUŠIĆ - Administratorski Panel</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="adminLoginForm">
            <div class="admin-form-group">
                <label for="adminEmail">
                    <i class="fas fa-envelope"></i> Email
                </label>
                <input type="email" id="adminEmail" required placeholder="Unesite email adresu">
            </div>

            <div class="admin-form-group">
                <label for="adminPassword">
                    <i class="fas fa-lock"></i> Lozinka
                </label>
                <input type="password" id="adminPassword" required placeholder="Unesite lozinku">
            </div>

            <button type="submit" class="admin-login-btn">
                <i class="fas fa-sign-in-alt"></i> Prijavi se
            </button>
        </form>

        <button type="button" class="reset-link" id="forgotPassword">Zaboravljena lozinka?</button>

        <div class="back-link">
            <a href="index.html">
                <i class="fas fa-arrow-left"></i> Povratak na početnu
            </a>
        </div>
    </div>

    <dialog id="resetDialog" class="reset-dialog" aria-labelledby="resetTitle" aria-describedby="resetHelp">
        <button type="button" class="reset-close" id="closeReset" aria-label="Zatvori">×</button>
        <h2 id="resetTitle">Nova lozinka</h2>
        <p id="resetHelp">Unesite email svojeg administratorskog računa. Poslat ćemo vam poveznicu za postavljanje nove lozinke.</p>
        <form id="adminResetForm">
            <div class="admin-form-group"><label for="resetEmail">Email računa</label><input id="resetEmail" type="email" autocomplete="email" required maxlength="254" placeholder="Unesite email adresu"></div>
            <button type="submit" class="admin-login-btn" id="sendReset">Pošalji poveznicu</button>
        </form>
        <p id="resetStatus" class="reset-status" role="status" aria-live="polite" hidden></p>
    </dialog>
    <script type="module">
        import { loginAdmin, sendPasswordReset } from './firebase-auth.js?v=loading-1';
        const resetDialog=document.getElementById('resetDialog'),resetEmail=document.getElementById('resetEmail'),resetStatus=document.getElementById('resetStatus'),sendReset=document.getElementById('sendReset');
        let resetBusy=false;
        document.getElementById('forgotPassword').addEventListener('click',()=>{
            if(!resetBusy){resetEmail.value=document.getElementById('adminEmail').value.trim();resetStatus.hidden=true;}
            resetDialog.showModal();resetEmail.focus();
        });
        document.getElementById('closeReset').addEventListener('click',()=>resetDialog.close());
        document.getElementById('adminResetForm').addEventListener('submit',async e=>{
            e.preventDefault();if(resetBusy)return;
            resetEmail.value=resetEmail.value.trim();if(!resetEmail.reportValidity())return;
            resetBusy=true;sendReset.disabled=true;resetEmail.disabled=true;sendReset.textContent='Šaljem…';resetStatus.hidden=true;
            try{
                const result=await sendPasswordReset(resetEmail.value);
                resetStatus.textContent=result.success?'Ako račun postoji za navedeni email, poslana je poveznica za novu lozinku. Provjerite pristiglu poštu i neželjenu poštu.':result.message||'Slanje nije uspjelo. Pokušajte ponovno.';
            }catch{resetStatus.textContent='Slanje nije uspjelo. Provjerite internetsku vezu i pokušajte ponovno.';}
            finally{resetStatus.hidden=false;resetBusy=false;sendReset.disabled=false;resetEmail.disabled=false;sendReset.textContent='Pošalji poveznicu';}
        });
        
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const errorMessage = document.getElementById('errorMessage');

            const submit=e.currentTarget.querySelector('[type="submit"]');
            if(submit.disabled)return;submit.disabled=true;errorMessage.style.display='none';
            let result;try{result=await loginAdmin(email,password);}finally{submit.disabled=false;}

            if (result.success) {
                // Firebase auth state persists automatically
                window.location.href = 'admin.html';
            } else {
                errorMessage.textContent = result.message || 'Neispravan email ili lozinka';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
