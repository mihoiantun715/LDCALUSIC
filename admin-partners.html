<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partneri · LD Čalušić</title><link rel="stylesheet" href="partner.css"><link rel="stylesheet" href="notification.css?v=2"></head><body><header><a href="admin.html">← Administracija</a><strong>Pristup partnera</strong><a href="jysk.html">JYSK portal</a></header><main><span class="eyebrow">ADMINISTRACIJA / PARTNERI</span><h1>JYSK suradnici</h1><p>Odobrite samo poznate suradnike. Partneri mogu unositi i pratiti vlastite zahtjeve; ne dobivaju administratorska prava.</p><button id="refresh">Osvježi zahtjeve</button><p id="message" role="status"></p><div id="members"></div></main><script src="notification.js?v=2"></script><script type="module">
import {auth,onAuthStateChanged,functions,httpsCallable} from './firebase-config.js';
const api=httpsCallable(functions,'partnerPortal'),host=document.getElementById('members'),msg=document.getElementById('message');
async function load(){try{const {data}=await api({action:'members'});host.replaceChildren();msg.textContent=data.members.length?'':'Nema zahtjeva. Suradnik najprije otvara JYSK portal i odabire „Zatražite pristup”.';for(const m of data.members){const card=document.createElement('article');card.className='order';for(const [tag,text] of [['h2',m.name],['p',m.email+' · '+m.store],['p',m.phone],['p',m.active?'Pristup odobren':'Pristup nije odobren']]){const el=document.createElement(tag);el.textContent=text;card.append(el);}const b=document.createElement('button');b.textContent=m.active?'Deaktiviraj pristup':'Odobri JYSK pristup';b.onclick=async()=>{if(!await notify.ask((m.active?'Deaktivirati':'Odobriti')+' JYSK pristup za '+m.email+'?'))return;b.disabled=true;try{await api({action:'access',uid:m.id,active:!m.active});await load();}catch(e){msg.textContent=e.message;b.disabled=false;}};card.append(b);host.append(card);}}catch(e){msg.textContent=e.message||'Nije moguće učitati partnere.';}}
onAuthStateChanged(auth,user=>{if(!user)location.href='admin-login.html';else load();});document.getElementById('refresh').onclick=load;
</script></body></html>
